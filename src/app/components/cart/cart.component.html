<div class="cart-container">
    <div class="cart-panel">
        <h3> Total items: {{ cartService.computedCartTotal() }}</h3>
        <div class="cart-item" *ngFor="let product of items()">
            <img [src]="product.Product.url" alt="{{ product.Product.name }}" class="cart-item-image" />
            <div class="cart-item-details">
                <h3>{{ product.Product.name }}</h3>
                <p>${{ product.Product.price }}</p>
                <label for="quantity-{{ product.Product.id }}">Amount:</label>
                <input name="quantity-{{ product.Product.id }}" type="number" class="number-input" 
                [(ngModel)]="product.Quantity" 
                (change)="cartService.updateQuantity(product.Product.id, product.Quantity)" />
            </div>
        </div>
        <h1>Total: ${{ cartService.computedCartTotalCost() }}</h1>
    </div>
    <div class="form-margin">
        <form #form="ngForm" (ngSubmit)="onSubmit(form)">
            <div class="input-margin">
                <label for="name">Full name</label>
                <br>
                <input type="text" id="name" name="name" minlength="3" placeholder="(minimum 3 characters)" required
                [(ngModel)]="name" (ngModelChange)="validateName($event)" />
                <p *ngIf="nameError">{{ nameError }}</p>
            </div>
            <br>
            <div class="input-margin">
                <label for="address">Address</label>
                <br>
                <input type="text" id="address" name="address" minlength="6" placeholder="(minimum 6 characters)" required
                [(ngModel)]="address" (ngModelChange)="validateAddress($event)" />
                <p *ngIf="addressError">{{ addressError }}</p>
            </div>
            <br>
            <div class="input-margin">
                <label for="creditCard">Credit card number</label>
                <br>
                <input type="text" id="creditCard" name="creditCard" minlength="16" maxlength="16"
                inputmode="numeric" pattern="[0-9]{16}" placeholder="(16-digit number)" required
                [(ngModel)]="creditCard" (ngModelChange)="validateCreditCard($event)" />
                <p *ngIf="creditCardError">{{ creditCardError }}</p>
            </div>
            <p>We'll never share your payment details with anyone else.</p>
            <button type="submit" [disabled]="form.invalid" class="btn btn-primary">Submit</button>
        </form>
    </div>
</div>
